<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全国の道路・河川などのライブカメラ画像を地図と一覧で確認するページです。">
  <title>全国ライブカメラ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./css/style.css?v=20260715-6">
</head>
<body>
  <div id="stickyStack" class="stickyStack">
    <header class="topbar">
      <div class="brandArea">
        <button id="prefectureMenuButton" class="iconButton" type="button" aria-controls="prefecturePanel" aria-expanded="false" aria-label="都道府県メニューを開く">☰</button>
        <div>
          <div class="siteTitle">全国ライブカメラ</div>
          <div id="pageSubtitle" class="pageSubtitle">データを読み込み中...</div>
        </div>
      </div>

      <div class="headerTools">
        <label class="compactControl">
          <span>自動スクロール</span>
          <select id="scrollSpeedSelect">
            <option value="0" selected>停止</option>
            <option value="180">遅い</option>
            <option value="360">普通</option>
            <option value="540">速い</option>
          </select>
        </label>
        <div class="timeInfo" aria-live="polite">
          <div id="clock">現在時刻 --:--:--</div>
          <div id="countdown">次回更新まで --秒</div>
        </div>
        <button id="refreshButton" class="primaryButton" type="button">画像を更新</button>
      </div>
    </header>

    <section class="summaryBar" aria-label="表示情報">
      <div class="currentPrefecture">
        <span class="summaryLabel">表示中</span>
        <strong id="prefectureName">-</strong>
      </div>
      <label>
        <span class="summaryLabel">エリア</span>
        <select id="areaSelect">
          <option value="all">全域</option>
        </select>
      </label>
      <button id="youtubeToggle" class="youtubeToggle" type="button" aria-pressed="false" title="YouTubeライブカメラの表示を切り替えます">
        <span class="youtubePlay" aria-hidden="true">▶</span>
        <span id="youtubeToggleLabel">YouTube OFF</span>
      </button>
      <button id="visibilityEditButton" class="editButton" type="button" aria-controls="visibilityPanel" aria-expanded="false">
        表示編集
      </button>
      <label class="searchBox">
        <span class="summaryLabel">絞り込み</span>
        <input id="cameraSearch" type="search" placeholder="市町村名・地点名" autocomplete="off">
      </label>
    </section>
  </div>

  <aside id="prefecturePanel" class="sidePanel prefecturePanel" aria-hidden="true">
    <div class="panelHeader">
      <div>
        <strong>都道府県を選択</strong>
        <p>灰色の項目はデータ準備中です。</p>
      </div>
      <button id="prefectureMenuClose" class="iconButton" type="button" aria-label="都道府県メニューを閉じる">×</button>
    </div>
    <nav id="prefectureNavigation" class="prefectureNavigation" aria-label="都道府県一覧"></nav>
  </aside>

  <aside id="visibilityPanel" class="sidePanel visibilityPanel" aria-hidden="true">
    <div class="panelHeader">
      <div>
        <strong>カメラの表示編集</strong>
        <p>チェックを外したカメラは、一覧と地図から非表示になります。設定はこのブラウザに保存されます。</p>
      </div>
      <button id="visibilityPanelClose" class="iconButton" type="button" aria-label="表示編集を閉じる">×</button>
    </div>
    <div class="visibilityTools">
      <input id="visibilitySearch" type="search" placeholder="市町村名・地点名を検索" autocomplete="off">
      <button id="showAllCamerasButton" class="secondaryButton" type="button">すべて表示</button>
    </div>
    <div id="visibilityList" class="visibilityList"></div>
  </aside>

  <div id="panelBackdrop" class="panelBackdrop" hidden></div>

  <main class="pageShell">
    <div id="statusMessage" class="statusMessage" role="status">データを読み込んでいます。</div>

    <div class="layout">
      <div id="content" class="cameraContent"></div>

      <aside class="mapWrap" aria-label="ライブカメラ地図">
        <div class="mapHeader">
          <div>
            <strong>カメラ位置</strong>
            <span id="mapHint">画像またはピンを選択できます</span>
          </div>
          <button id="resetMapButton" class="secondaryButton" type="button">全域表示</button>
        </div>
        <div id="map"></div>
      </aside>
    </div>
  </main>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="ライブカメラ拡大表示" aria-hidden="true">
    <button id="viewerClose" class="viewerClose" type="button" aria-label="拡大表示を閉じる">×</button>
    <figure class="viewerFigure">
      <img id="viewerImage" alt="">
      <figcaption id="viewerCaption"></figcaption>
    </figure>
  </div>


  <div id="youtubeViewer" class="viewer youtubeViewer" role="dialog" aria-modal="true" aria-label="YouTubeライブカメラ一覧" aria-hidden="true">
    <button id="youtubeViewerClose" class="viewerClose" type="button" aria-label="YouTube一覧を閉じる">×</button>
    <section class="youtubeGalleryPanel">
      <div class="youtubeGalleryHeader">
        <div>
          <h2>YouTubeライブカメラ</h2>
          <p>見たいカメラを選ぶと、YouTubeを別タブで開きます。</p>
        </div>
      </div>
      <div id="youtubeGalleryList" class="youtubeGalleryGrid"></div>
    </section>
  </div>

  <noscript>このページを表示するにはJavaScriptを有効にしてください。</noscript>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module" src="./js/app.js?v=20260715-6"></script>
</body>
</html>
