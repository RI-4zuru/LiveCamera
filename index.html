<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全国の道路・河川などのライブカメラ画像を地図と一覧で確認するページです。">
  <title>全国ライブカメラ</title>

  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3ynhrrxCVfwpW1w4ZV5T8+o1b3kMo=" crossorigin="">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brandArea">
      <button id="prefectureMenuButton" class="iconButton" type="button" aria-controls="prefecturePanel" aria-expanded="false" aria-label="都道府県メニューを開く">☰</button>
      <div>
        <div class="siteTitle">全国ライブカメラ</div>
        <div id="pageSubtitle" class="pageSubtitle">データを読み込み中...</div>
      </div>
    </div>

    <div class="headerTools">
      <label class="compactControl">
        <span>自動スクロール</span>
        <select id="scrollSpeedSelect">
          <option value="0" selected>停止</option>
          <option value="20">遅い</option>
          <option value="45">普通</option>
          <option value="80">速い</option>
        </select>
      </label>
      <div class="timeInfo" aria-live="polite">
        <div id="clock">現在時刻 --:--:--</div>
        <div id="countdown">次回更新まで --秒</div>
      </div>
      <button id="refreshButton" class="primaryButton" type="button">画像を更新</button>
    </div>
  </header>

  <aside id="prefecturePanel" class="prefecturePanel" aria-hidden="true">
    <div class="panelHeader">
      <div>
        <strong>都道府県を選択</strong>
        <p>灰色の項目はデータ準備中です。</p>
      </div>
      <button id="prefectureMenuClose" class="iconButton" type="button" aria-label="都道府県メニューを閉じる">×</button>
    </div>
    <nav id="prefectureNavigation" class="prefectureNavigation" aria-label="都道府県一覧"></nav>
  </aside>
  <div id="panelBackdrop" class="panelBackdrop" hidden></div>

  <main class="pageShell">
    <section class="summaryBar" aria-label="表示情報">
      <div>
        <span class="summaryLabel">表示中</span>
        <strong id="prefectureName">-</strong>
      </div>
      <div>
        <span class="summaryLabel">カメラ数</span>
        <strong id="cameraCount">0</strong>
      </div>
      <label>
        <span class="summaryLabel">エリア</span>
        <select id="areaSelect">
          <option value="all">全域</option>
        </select>
      </label>
      <label class="searchBox">
        <span class="summaryLabel">絞り込み</span>
        <input id="cameraSearch" type="search" placeholder="市町村名・地点名" autocomplete="off">
      </label>
    </section>

    <div id="statusMessage" class="statusMessage" role="status">データを読み込んでいます。</div>

    <div class="layout">
      <div id="content" class="cameraContent"></div>

      <aside class="mapWrap" aria-label="ライブカメラ地図">
        <div class="mapHeader">
          <div>
            <strong>カメラ位置</strong>
            <span id="mapHint">画像またはピンを選択できます</span>
          </div>
          <button id="resetMapButton" class="secondaryButton" type="button">全域表示</button>
        </div>
        <div id="map"></div>
      </aside>
    </div>
  </main>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="ライブカメラ拡大表示" aria-hidden="true">
    <button id="viewerClose" class="viewerClose" type="button" aria-label="拡大表示を閉じる">×</button>
    <figure class="viewerFigure">
      <img id="viewerImage" alt="">
      <figcaption id="viewerCaption"></figcaption>
    </figure>
  </div>

  <noscript>このページを表示するにはJavaScriptを有効にしてください。</noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
